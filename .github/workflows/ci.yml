name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scripts/version.sh counts commits this month

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc binutils

      - name: Install Xvfb + x11-apps (for internal/bridge's GUI-TUI Bridge tests)
        run: sudo apt-get install -y xvfb x11-apps

      - name: Install dbus + at-spi2-core + zenity (for the AT-SPI text overlay tests)
        run: sudo apt-get install -y dbus-x11 at-spi2-core zenity

      - name: Build (vendored libvterm + binary)
        run: ./build.sh

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "$fmt_out"
            echo "::error::gofmt found unformatted files (run: gofmt -w .)"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test ./... -race
